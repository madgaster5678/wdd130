<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
      content="this site is for how to contact our company to book appointments, ask questions, and see some of our employees.">
    <meta name="author" content="Ammon Griner">
    <title>Contact Us</title>
    <link rel="stylesheet" href="styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/wwr_logo.jpg" alt="company logo">
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>
    <main>
        <h1>DMC White Water Rafting</h1>
        <address>
            <p>166 W 13th Avenue</p>
            <p>Denver, Colorado</p>
            <p>+1 (303) 338-4562</p>
            <p>DanteDevilhunter@gmail.com</p>
        </address>
        <section>
            <iframe
              src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3066.1602512166482!2d-105.02176708718864!3d39.78095893507749!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x876b80aa231f17cf%3A0x118ef4f8278a36d6!2sDenver%2C%20CO!5e0!3m2!1sen!2sus!4v1785519712943!5m2!1sen!2sus"
              width="600" height="450" allowfullscreen="" loading="lazy"
              referrerpolicy="strict-origin-when-cross-origin"></iframe>

            <form>
                <label for="name">Name</label>
                <input type="text" name="name" id="name" placeholder="John Smith">
                <label for="email">Email</label>
                <input type="text" name="email" id="email" placeholder="johnsmith@email.com">
                <p>Message Purpose</p>
                <div class="radio-option">
                    <input type="radio" name="purpose" id="general" value="general inquiry">
                    <label for="general">General Inquiry</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="purpose" id="reservation"
                      value="reservation questions">
                    <label for="reservation">Reservation Questions</label>
                </div>
                <div class="radio-option">
                    <input type="radio" name="purpose" id="website" value="website suggestion">
                    <label for="website">Website Suggestion</label>
                </div>
                <label for="message">Message</label>
                <textarea name="message" id="message"></textarea>
                <div>
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>
                <button type="submit">Get in Touch!</button>
            </form>
        </section>
        <div class="employees">
            <h2>We are here to help</h2>
            <figure>
                <figcaption>Dante: our CEO</figcaption>
                <img src="images/danteface.jpg" alt="dante ceo">
            </figure>
            <figure>
                <figcaption>Nero: Chief Rout Planner</figcaption>
                <img src="images/neroface.jpg" alt="nero chief route planner">
            </figure>
            <figure>
                <figcaption>Trish: our Reservations Manager</figcaption>
                <img src="images/trishface.jpg" alt="trish main desk employee">
            </figure>
        </div>
    </main>
    <footer>
        <p>©️ 2026 💦 DMC White Water Rafting 💦 Ammon Griner</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebook-square.png" alt="facebook page">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedin-square.png" alt="linkedin page">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagram-logo.png" alt="instagram page">
            </a>
        </nav>
    </footer>
</body>

</html>
